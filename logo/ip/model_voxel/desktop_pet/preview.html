<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CatGray 桌宠动作预览</title>
<style>body{font:16px system-ui;margin:32px;background:#19202b;color:#edf1fa}main{max-width:920px;margin:auto}button,select{font:inherit;padding:8px;margin:4px;border-radius:8px}#stage{height:450px;display:grid;place-items:center;border-radius:16px;background:repeating-conic-gradient(#e7e9ee 0 25%,#fff 0 50%) 0/24px 24px;overflow:auto}canvas{width:288px;height:312px}p{line-height:1.7}label{display:inline-block;margin:8px}#status{font-variant-numeric:tabular-nums}</style>
<main><h1>CatGray 桌宠动作预览</h1><p>统一全身镜头 · 透明 Sprite · 192 × 208 · 8 FPS</p><div id="states"></div><div id="stage"><canvas width="192" height="208"></canvas></div><p id="status" role="status">正在加载图集…</p><label>扩展动作 <select id="extra"><option value="">选择动作</option><option>walk</option><option>run</option><option>jump</option></select></label><button id="pause">暂停</button><label>大小 <select id="scale"><option value="1">1×</option><option value="1.5" selected>1.5×</option><option value="2">2×</option></select></label><p>状态持续循环；临时动作结束后回到当前状态。移动动作只播放原地步态。跳跃高度已包含在帧内。此页面用于素材检查，不是 Qt 组件验收。</p><p><a href="manifest.json">角色包清单</a> · <a href="contact_sheet.png">动作总览</a> · <a href="LICENSE.txt">素材授权</a></p></main>
<script>
const plan=[['idle',4],['thinking',3],['working',2],['waiting',4],['speaking',3],['success',3],['error',3],['walk',4],['run',2],['jump',2]];
let start=0;const clips=Object.fromEntries(plan.map(([name,d])=>{const c={start,count:d*8,loop:name!=='jump'};start+=c.count;return[name,c]}));
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),image=new Image();let state='idle',current=state,epoch=0,paused=false,pauseTime=0,ready=false;
function play(name){current=name;epoch=performance.now();if(paused)pauseTime=epoch;document.querySelector('#extra').value=''}
const labels=['待机','思考','工作','等待','说话','成功','失败'];plan.slice(0,7).forEach(([name],i)=>{const b=document.createElement('button');b.textContent=labels[i];b.onclick=()=>{state=name;play(name)};document.querySelector('#states').append(b)});
document.querySelector('#extra').onchange=e=>{if(e.target.value)play(e.target.value)};
document.querySelector('#pause').onclick=e=>{paused=!paused;if(paused)pauseTime=performance.now();else epoch+=performance.now()-pauseTime;e.target.textContent=paused?'继续':'暂停'};
document.querySelector('#scale').onchange=e=>{canvas.style.width=192*Number(e.target.value)+'px';canvas.style.height=208*Number(e.target.value)+'px'};
image.onload=()=>{ready=true;epoch=performance.now()};image.onerror=()=>document.querySelector('#status').textContent='图集加载失败，请确认 spritesheet.png 位于同一目录';image.src='spritesheet.png';
function draw(now){if(ready&&!paused){let c=clips[current],frame=Math.floor((now-epoch)*8/1000);if(!c.loop&&frame>=c.count){play(state);c=clips[current];frame=0}frame%=c.count;const n=c.start+frame;ctx.clearRect(0,0,192,208);ctx.drawImage(image,n%16*192,Math.floor(n/16)*208,192,208,0,0,192,208);document.querySelector('#status').textContent=`${current} · ${frame+1}/${c.count} · 逻辑状态 ${state}`}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
