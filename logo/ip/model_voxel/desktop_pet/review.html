<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CatGray 四种状态动作对比</title><style>body{font:16px system-ui;background:#19202b;color:#edf1fa;margin:24px}main{max-width:1000px;margin:auto}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}article{padding:16px;border:1px solid #465165;border-radius:14px}video{width:100%;max-height:416px;background:#e8edf3;border-radius:10px}p{line-height:1.6}a{color:#ffc872}</style><main><h1>四种状态动作对比</h1><p>本轮重点：整体姿态、肢体动作和节奏能否区分状态。视频使用浅色检查背景；角色图集仍为透明背景。可用各视频的播放按钮单独检查。</p><section><article><h2>思考</h2><video src="review/thinking.mp4" autoplay loop muted controls playsinline></video><p>抬爪悬停在下巴下方，另一爪收在身体前侧；歪头、半眯眼，动作较集中。</p></article><article><h2>工作</h2><video src="review/working.mp4" autoplay loop muted controls playsinline></video><p>视线向下，双爪在体素键盘上交替敲击，工作道具仅在此状态出现。</p></article><article><h2>等待</h2><video src="review/waiting.mp4" autoplay loop muted controls playsinline></video><p>双臂放松，缓慢左右张望，脚保持原位并轻微移动重心。</p></article><article><h2>说话</h2><video src="review/speaking.mp4" autoplay loop muted controls playsinline></video><p>专用说话嘴型按闭口→张口→收口变化，配合停顿、爪子手势和点头；不是 A／E／O 轮播或音素同步。</p></article></section><p><a href="review/speech_mouth_shapes.png">专用嘴型对照（闭口／小开／中开／大开）</a> · <a href="review/clearance_views.png">思考／工作手部多视角检查</a> · <a href="preview.html">完整角色包预览</a> · <a href="CatGray_DesktopPet.blend">可编辑 Blender 工程</a></p></main></html>
