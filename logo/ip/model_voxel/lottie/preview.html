<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>CatGray 全部矢量动画</title><style>body{margin:0;background:#171c22;color:#eee;font:16px system-ui;text-align:center}header{padding:20px}h1{margin:0 0 10px}p{color:#aeb8c3}nav{max-width:950px;margin:0 auto 14px}button{background:#303b47;color:white;border:1px solid #4a5d70;border-radius:8px;padding:10px 17px;margin:5px;cursor:pointer}.active{background:#895b11;border-color:#ffc451}iframe{border:0;width:100%;height:740px}a{color:#ffc451}</style><header><h1>CatGray · 全部矢量动画</h1><p>12 个独立动作 + 35.5 秒串联 · 透明背景 · 24 FPS</p><nav><button onclick="openClip('CatGray_All_Actions',this)">全部串联</button><button onclick="openClip('Walk_InPlace',this)">走动</button><button onclick="openClip('Run_InPlace',this)">跑动</button><button onclick="openClip('Jump',this)">跳跃</button><button onclick="openClip('Head_Nod',this)">点头</button><button onclick="openClip('Head_Shake',this)">摇头</button><button onclick="openClip('Head_Turn',this)">转头</button><button onclick="openClip('Blink',this)">眨眼</button><button onclick="openClip('Mouth_Talk',this)">嘴型</button><button onclick="openClip('Emotion_Joy',this)">喜悦</button><button onclick="openClip('Emotion_Sad',this)">悲伤</button><button onclick="openClip('Emotion_Pain',this)">痛苦</button><button onclick="openClip('Emotion_Angry',this)">生气</button></nav><a id="download" href="all_actions/Walk_InPlace.json" download>下载当前 JSON</a></header><iframe id="viewer" src="all_actions/Walk_InPlace.html" title="动画预览"></iframe><script>function openClip(name,button){document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));button.classList.add('active');document.getElementById('viewer').src='all_actions/'+name+'.html';document.getElementById('download').href='all_actions/'+name+'.json';}document.querySelectorAll('nav button')[1].classList.add('active');</script></html>
